name: Documentation
description: Something in the docs is wrong, missing or hard to follow.
labels: [documentation]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: The file or the link, and the section.
      placeholder: docs/commands.md, "Getting the bot into your channel"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording
