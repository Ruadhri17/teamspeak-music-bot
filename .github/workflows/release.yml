# Publishes a release when a tag v* is pushed, see docs/release.md.
#
# The release has one binary per architecture, tsmusic-<target>, the notices of the crates
# built into it, THIRD_PARTY_LICENSES.txt, and SHA256SUMS.
# install.sh and `tsmusic setup` depend on these names.
#
# The binaries are built on Ubuntu 22.04, so they need glibc 2.35 at most, as README.md
# and docs/install.md say. A newer runner raises that requirement.
# No build cache here, every release is built from scratch.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the tag with the version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: [ci, version]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      # The bundled opus is built with cmake.
      - name: Install cmake
        run: |
          if ! command -v cmake >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends cmake
          fi

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      - name: Check the binary
        run: |
          bin="target/$TARGET/release/tsmusic"
          "$bin" --version
          ldd "$bin"
          if ldd "$bin" | grep -q opus; then
            echo "::error::the binary needs libopus from the system, opus must be built in"
            exit 1
          fi
          echo "Newest glibc symbol: $(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)"
          mkdir dist
          cp "$bin" "dist/tsmusic-$TARGET"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tsmusic-${{ matrix.target }}
          path: dist/tsmusic-${{ matrix.target }}
          if-no-files-found: error

  licenses:
    name: Third-party licenses
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same version as `just deps`, from its release with the checksum checked.
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-about@0.9.3
          fallback: none

      # MIT and the BSD licenses require their notices next to the binary, see about.toml.
      - name: Write THIRD_PARTY_LICENSES.txt
        run: |
          mkdir dist
          cargo about generate --locked --fail about.hbs -o dist/THIRD_PARTY_LICENSES.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-licenses
          path: dist/THIRD_PARTY_LICENSES.txt
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [build, licenses]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum tsmusic-* THIRD_PARTY_LICENSES.txt >SHA256SUMS
          cat SHA256SUMS

      # A tag with a suffix (v0.2.0-rc.1) is a pre-release, releases/latest and install.sh skip it.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"
