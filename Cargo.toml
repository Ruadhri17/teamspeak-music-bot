[package]
name = "teamspeak-music-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
audiopus = "0.3.0-rc.0"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
humantime = "2.4.0"
humantime-serde = "1.1.1"
regex = "1.13.1"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tidalrs = "0.6.2"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tsclientlib = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5", version = "0.2.0" }
tsproto-packets = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5", version = "0.1.0" }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
