[package]
name = "teamspeak-music-bot"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ruadhri17/teamspeak-music-bot"

[[bin]]
name = "tsmusic"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
audiopus = "0.3.0-rc.0"
# Opus is linked into the binary, so a release runs without libopus installed.
audiopus_sys = { version = "0.2.2", features = ["static"] }
clap = { version = "4.6.7", features = ["derive"] }
cliclack = "0.5.7"
futures = "0.3.34"
humantime = "2.4.0"
humantime-serde = "1.1.1"
rustix = { version = "1.1.6", features = ["process"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tsclientlib = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5", version = "0.2.0" }
tsproto-packets = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5", version = "0.1.0" }
url = "2.5.8"
