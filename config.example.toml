# TeamSpeak music bot configuration.
#
# Every field is optional: a missing one gets its default value (as shown below).
# An unknown key (e.g. a typo) is a startup error.
# [live]    = meant to take effect without a restart, through `!bot config set` and reloading,
#             which do not exist yet: for now every change needs a restart
# [restart] = always requires a bot restart
# (not implemented yet) = accepted and checked, but the bot does not use it yet
# Durations are written as text: "30s", "1m", "10m", "1h 30m".
# Secrets do NOT belong in this file: keep them in secrets.toml.

[teamspeak]
address = "localhost"               # [restart] host, host:port, IP or server nickname (default port 9987)
nickname = "MusicBot"               # [live]
# The bot needs the server permission b_client_modify_own_description to set it.
description = "Exemplary description"   # [live]
identity_file = "identity.toml"     # [restart] relative to paths.state_dir
# Bot's home channel: ID or name/path ("Parent/Channel").
# Not set = server's default channel.
# home_channel = 22                 # [live]

[audio]
bitrate = 96                        # [live] Opus kb/s, range 32-192
complexity = 10                     # [live] 0-10
start_buffer = "3s"                 # [restart] gathered before the bot starts speaking, also after the buffer ran dry. A shorter sound starts once it is all in
max_buffer = "15s"                  # [restart] upper limit of the frame buffer, at most 60s. The next song opens this long before the end of the current one: opening a YouTube song takes about 10s, a shorter buffer leaves a gap
default_volume = 50                 # [live] 0-100, volume after start (logarithmic scale, 50 is about -21 dB)
max_volume = 100                    # [live] 0-100, highest value allowed for `!bot volume`
pause_release_after = "5m"          # [live] release the stream after being paused this long (not implemented yet)

# Events. Each one except on_disconnect may do any of these, every action is optional
# and an event without actions does nothing:
#   delay        wait this long after the condition is met, default "0s"
#   set_volume   0-100 (at most audio.max_volume) or "{default}" for audio.default_volume,
#                like !bot volume, so the sound below plays with it already
#   message      channel message
#   sound        a file, or a YouTube link (looked up once after the start, and each
#                time it plays it starts a few seconds later than a file),
#                played outside the queue to its end
#   move_to      "home", or { channel = 22 } / { channel = "Parent/Channel" }
#   description  "" clears it
#   nickname     3-30 characters
# They run in this order, whatever the order in the file. The rest waits for the end of
# the sound.
# A written event section has only the actions it lists.
# Description and nickname stay as an event set them, another event may set them back.
# Placeholders in the texts:
#   {default}    in description and nickname: the value from [teamspeak]
#   {song}       in on_song_start: the song, as !song current shows it
#   {source}     in on_song_start: where the song comes from, e.g. YouTube
# A nickname with placeholders is cut to 30 characters.
# Arriving home always clears the queue. Music playing for nobody at home stops
# after on_alone's delay.

[events.on_connect]                 # bot connected to the server, also after a reconnect
# message = "Hello!"                # [live]
# nickname = "{default}"            # [live]

[events.on_disconnect]              # bot disconnects on shutdown, no other actions, no placeholders
# message = "See you later"         # [live] disconnect reason shown to users

[events.on_idle]                    # nothing played for `delay` away from home (pause counts as idle)
delay = "10m"                       # [live] must be more than 0
# set_volume = "{default}"          # [live] the next people start from the default volume
# message = "Nothing is playing, going back home"      # [live]
# sound = "/home/tsmusic/channel-music/goodbye.wav"   # [live]
move_to = "home"                    # [live]

[events.on_alone]                   # bot alone in its channel for `delay`, away from home
delay = "1m"                        # [live] must be more than 0
# set_volume = "{default}"          # [live]
# sound = "/home/tsmusic/channel-music/goodbye.wav"   # [live]
move_to = "home"                    # [live]

[events.on_party]                   # someone is in the bot's channel and nothing plays (not at home)
# set_volume = 70                   # [live] the welcome and the music after it
# sound = "/home/tsmusic/channel-music/welcome.wav"   # [live] played before the queue
# description = "Playing music, drag me to your channel when I am home"   # [live]

[events.on_song_start]              # a song from the queue started, every action except sound
# message = "Now playing: {song}"   # [live]
# description = "{default} | now: {song}"             # [live]

[queue]
# max_len = 1000                    # [live] not set = unlimited
show_page_size = 15                 # [live] entries per page in !queue show

[permissions]
# Server groups by name (case-insensitive) or ID, e.g. ["Admin", 6].
# Everyone in the bot's channel controls it. Who may drag the bot is set on the server.
admin_groups = []                   # [live] !bot config, summon while the bot is busy elsewhere, empty = no admins
blocked_groups = []                 # [live] e.g. ["No Bot"], cannot control or summon, admin takes precedence

[sources]
default = "youtube"                 # [live] tidal | spotify | youtube | soundcloud | local
max_playlist_len = 500              # [live] most songs one playlist link adds, the rest is left out
max_parallel_lookups = 2            # [restart] lookups of !song add running at once (one yt-dlp each), the rest wait their turn. Raise it on a stronger machine

[sources.tidal]
quality = "high"                    # [live] low | high | lossless (not implemented yet, Tidal is not available)

[sources.youtube]
yt_dlp_path = "yt-dlp"              # [live]
# YouTube clients tried first, faster than the yt-dlp defaults.
# If they fail, yt-dlp retries with its own choice. [] = always let yt-dlp choose.
player_clients = ["visionos"]       # [live]
# Cookies of a YouTube account, for when YouTube asks the bot to sign in (common on a VPS)
# and for age-restricted videos. Used only with the yt-dlp defaults, so on a VPS set
# player_clients = [] as well. Owned by the bot's user, mode 0600. See docs/youtube.md.
# Not set = no account.
# cookies_file = "youtube-cookies.txt"  # [live]

[sources.local]
# Folder with local files. Paths outside it are blocked.
# Not set = local source disabled.
# music_dir = "/home/tsmusic/music" # [live]

[paths]
state_dir = "state"                 # [restart] identity, Tidal session. On the VPS: /var/lib/tsmusic
secrets_file = "secrets.toml"       # [restart] passwords and API keys, must be 0600 (see secrets.example.toml)
ffmpeg_path = "ffmpeg"              # [live]

[logging]
level = "info"                      # [live] error | warn | info | debug | trace (RUST_LOG takes precedence)
# Audio statistics while playing: frames, encoding time, underruns, late ticks.
# Logged at debug, and at warn when the audio clock stalled or the buffer ran dry.
metrics_interval = "60s"            # [restart] how often they are summed up
