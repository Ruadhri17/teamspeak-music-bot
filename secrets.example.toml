# Secrets of the TeamSpeak music bot: the passwords that do not belong in config.toml.
#
# The file must belong to the user the bot runs as and be readable by nobody else,
# otherwise the bot refuses to start. `tsmusic setup` writes it that way as
# /etc/tsmusic/secrets.toml. Without setup, keep it next to config.toml:
#
#   cp secrets.example.toml secrets.toml && chmod 600 secrets.toml
#
# Every value is optional. Remove the # to set one, an empty value is an error.
#
# Optional: systemd can keep the file encrypted. The bot then reads the credential
# named `secrets` instead of this file:
#
#   systemd-creds encrypt secrets.toml /etc/tsmusic/secrets.cred
#   systemctl edit tsmusic   and add under [Service]:
#   LoadCredentialEncrypted=secrets:/etc/tsmusic/secrets.cred

[teamspeak]
# server_password = ""
# channel_password = ""             # password of teamspeak.home_channel
