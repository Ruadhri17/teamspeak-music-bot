# Secrets for the TeamSpeak music bot. Copy to secrets.toml and restrict access:
#
#   cp secrets.example.toml secrets.toml && chmod 600 secrets.toml
#
# The bot refuses to start if the file is readable by other users.
# Every value is optional, remove a line instead of leaving it empty.
# Under systemd the file is passed as an encrypted credential:
#
#   systemd-creds encrypt secrets.toml /etc/tsmusic/secrets.cred
#   LoadCredentialEncrypted=secrets:/etc/tsmusic/secrets.cred

[teamspeak]
# server_password = ""
# channel_password = ""             # password of teamspeak.home_channel

[tidal]
# client_id = ""
# client_secret = ""
